<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <!-- Centerline curve of the cream ribbon in the 1:1 square panel -->
    <path id="ribbonCurve" d="M 120 152 C 340 108, 660 108, 880 152" fill="none"/>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#FF85A2" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background outline stroke for crisp contrast against cream paper -->
  <text font-family="'Libre Franklin', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2.2">
    <textPath href="#ribbonCurve" startOffset="50%" text-anchor="middle" dominant-baseline="central"
              fill="#171717" stroke="#171717" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
      &#x2665; JOYEUX ANNIVERSAIRE, TIFA ! &#x2665;
    </textPath>
  </text>

  <!-- Foreground Vibrant Hot Pink Fill (#E8266B) -->
  <text font-family="'Libre Franklin', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2.2" filter="url(#textGlow)">
    <textPath href="#ribbonCurve" startOffset="50%" text-anchor="middle" dominant-baseline="central"
              fill="#E8266B">
      &#x2665; JOYEUX ANNIVERSAIRE, TIFA ! &#x2665;
    </textPath>
  </text>
</svg>
